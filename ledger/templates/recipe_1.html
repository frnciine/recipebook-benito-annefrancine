{% extends 'base.html' %}

{% load static %}

{% block title %}Recipe Book{% endblock %}
{% block content %}
    <ul>
        <li>
            {{ name }}
            <ul>
                {% for ingredient in ingredients %}
                <li>{{ ingredient.name }}:{{ ingredient.quantity }}</li>
                {% endfor %}
            </ul>   
            <a href="{{ link }}">Recipe 1 Link</a>
        </li>
    </ul>
{% endblock %}
